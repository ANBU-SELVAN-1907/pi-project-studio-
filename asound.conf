# ALSA Configuration for Duplex I2S on Raspberry Pi Zero W
# Audio Input: INMP441 MEMS Microphone (I2S Input)
# Audio Output: MAX98357A Amp/Speaker (I2S Output)

pcm.!default {
    type asym
    playback.pcm "i2s_out"
    capture.pcm "i2s_in"
}

ctl.!default {
    type hw
    card 0
}

# I2S Playback (MAX98357A)
pcm.i2s_out {
    type plug
    slave {
        pcm "hw:0,0"
        rate 44100
        format S16_LE
        channels 2
    }
}

# I2S Capture (INMP441)
pcm.i2s_in {
    type plug
    slave {
        pcm "hw:0,0"
        rate 16000
        format S16_LE
        channels 1
    }
}
